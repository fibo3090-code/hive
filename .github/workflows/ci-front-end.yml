name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - 'front-end/**'
      - '.github/workflows/ci-front-end.yml'
  pull_request:
    paths:
      - 'front-end/**'
      - '.github/workflows/ci-front-end.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_INSTALL_SKIP_REPOSITORIES: 1

jobs:
  lint-typecheck:
    name: lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: front-end
    strategy:
      matrix:
        include:
          - bun-version: latest
          - bun-version: '1.1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Cache dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: front-end/node_modules
          key: fe-deps-${{ runner.os }}-${{ matrix.bun-version }}-${{ hashFiles('front-end/package.json') }}
          restore-keys: |
            fe-deps-${{ runner.os }}-${{ matrix.bun-version }}-
            fe-deps-${{ runner.os }}-

      - name: Install deps
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

  build-test:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: front-end/node_modules
          key: fe-deps-${{ runner.os }}-latest-${{ hashFiles('front-end/package.json') }}
          restore-keys: |
            fe-deps-${{ runner.os }}-latest-
            fe-deps-${{ runner.os }}-

      - name: Cache build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: front-end/dist
          key: fe-build-${{ runner.os }}-${{ hashFiles('front-end/src/**', 'front-end/public/**', 'front-end/index.html', 'front-end/package.json') }}
          restore-keys: |
            fe-build-${{ runner.os }}-

      - name: Install deps
        run: bun install

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

  # Frontend dependency CVE audit. No lockfile is committed (bun.lockb
  # and package-lock.json are both gitignored), so this job must
  # materialize one via `npm install` before it can audit anything —
  # skipping that step is why `bun audit` used to fail with
  # "Lockfile not found" on every run.
  #
  # The gate is scoped to production dependencies only
  # (`npm audit --omit=dev`): `bun audit` has no prod-only/omit-dev
  # flag (confirmed via `bun audit --help`), so we use `npm audit`
  # unconditionally here for a deterministic, reproducible gate
  # rather than branching on bun/npm availability. Dev-only tooling
  # CVEs (e.g. the vite/esbuild dev-server advisories, C544/C545)
  # don't ship to users and shouldn't block application merges — they
  # are tracked separately in docs/SECURITY.md §4 and
  # docs/BACKLOG.md §4.4. `--audit-level=high` keeps Medium/Low
  # advisories out of the failure path so the workflow tracks
  # blocking issues only.
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # No Bun setup needed: this job only ever uses `npm`, which
      # ships preinstalled on GitHub-hosted ubuntu-latest runners.
      - name: Install (materialize lockfile for audit)
        run: npm install --no-audit --no-fund --silent

      - name: Audit (production dependencies only)
        run: npm audit --audit-level=high --omit=dev
