name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - 'back-end/**'
      - '!.github/**'
      - '!.*.md'
  pull_request:
    paths:
      - 'back-end/**'
      - '!.github/**'
      - '!.*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt-clippy:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: back-end
    strategy:
      matrix:
        include:
          - rust: stable
          - rust: 1.85.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f742c62075b406880c3f0856267963f1732 # master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371100f20ad3e857e27e91aaee3d7c36a33c9 # v2.7.7
        with:
          shared-key: be-cache-${{ matrix.rust }}}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-build:
    name: test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f742c62075b406880c3f0856267963f1732 # master
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371100f20ad3e857e27e91aaee3d7c36a33c9 # v2.7.7
        with:
          shared-key: be-cache-stable

      - name: Get build cache key
        id: cache-key
        run: |
          hash="${{ hashFiles('back-end/**/Cargo.toml') }}"
          echo "value=$hash" >> $GITHUB_OUTPUT

      - name: Restore build artifact
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372fd86344c # v4.1.9
        with:
          name: target
          path: back-end/target

      - name: Cache target directory
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d77c138f676c # v4.2.2
        if: github.event_name != 'pull_request'
        with:
          path: back-end/target
          key: be-target-${{ runner.os }}-${{ hashFiles('back-end/**/Cargo.lock') }}
          restore-keys: |
            be-target-${{ runner.os }}-

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: build (release profile, sanity)
        run: cargo build --workspace --release

      - name: Upload build artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea23f011e825229d05030244c # v4.6.1
        with:
          name: target
          path: back-end/target
          retention-days: 1
          if-no-files-found: error