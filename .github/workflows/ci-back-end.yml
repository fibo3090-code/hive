name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - 'back-end/**'
      - '.github/workflows/ci-back-end.yml'
  pull_request:
    paths:
      - 'back-end/**'
      - '.github/workflows/ci-back-end.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # rustfmt output is toolchain-specific, so we only run it against a single
  # pinned version. Running fmt on an older MSRV toolchain would flag
  # formatting that was produced by a newer rustfmt — a bogus failure mode.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: 1.94.1
          components: rustfmt

      - name: versions
        run: |
          rustc --version
          cargo fmt --version

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Toolchain is pinned in `back-end/rust-toolchain.toml` (single
      # source of truth). The Sprint-1 dependency bumps (reqwest 0.12
      # with stream feature, futures-util 0.3, bytes) lifted the
      # effective MSRV above 1.85, so a 1.85 MSRV guard no longer
      # applies to this workspace.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: 1.94.1
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: be-cache-1.94.1

      - name: versions
        run: |
          rustc --version
          cargo clippy --version

      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Smoke-test only — clippy already validates compilation and lints.
  # A release-profile rebuild was pushing the job past its 20 min cold-cache
  # budget, for no additional signal.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: 1.94.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: be-cache-1.94.1

      - name: cargo test
        run: cargo test --workspace --all-targets

  # Dependency CVE audit. Fails the workflow on Critical/High advisories
  # — Medium and below are reported but not blocking. Allow-listed
  # advisories live in `back-end/Cargo.audit.toml` (commit alongside the
  # rationale).
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: 1.94.1

      - name: Cache cargo audit binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          # Bump this key whenever the pinned version below changes, or the
          # `if ! command -v` guard skips the upgrade and the stale cached
          # binary sticks forever.
          key: cargo-audit-bin-v0.22

      - name: Install cargo-audit
        # 0.22+ pulls rustsec 0.31, which understands CVSS 4.0 advisory
        # frontmatter. Older (0.21 → rustsec 0.30) aborts the whole DB load
        # with "unsupported CVSS version: 4.0" once any advisory uses CVSS 4.0.
        # Needs Rust >= 1.89; this job runs 1.94.1.
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked --version 0.22.* || \
              cargo install cargo-audit --locked
          fi

      - name: cargo audit
        # Ignored advisories are all "unmaintained" notices on transitive deps
        # we don't pull directly and can't unilaterally bump — none are
        # actionable vulnerabilities. Revisit when an upstream drops them.
        #   RUSTSEC-2023-0071  rsa  (Marvin timing sidechannel; via sqlx-mysql, unused)
        #   RUSTSEC-2025-0057  fxhash         (unmaintained)
        #   RUSTSEC-2026-0173  proc-macro-error2 (unmaintained)
        #   RUSTSEC-2024-0436  paste  (unmaintained; via restate-sdk-macros, feature `restate`)
        run: >-
          cargo audit --deny warnings
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2025-0057
          --ignore RUSTSEC-2026-0173
          --ignore RUSTSEC-2024-0436
