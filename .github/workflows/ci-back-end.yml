name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - 'back-end/**'
      - '.github/workflows/ci-back-end.yml'
  pull_request:
    paths:
      - 'back-end/**'
      - '.github/workflows/ci-back-end.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # rustfmt output is toolchain-specific, so we only run it against a single
  # pinned version. Running fmt on an older MSRV toolchain would flag
  # formatting that was produced by a newer rustfmt — a bogus failure mode.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: 1.94.1
          components: rustfmt

      - name: Override rust-toolchain.toml with pinned version
        run: rustup override set 1.94.1

      - name: versions
        run: |
          rustc --version
          cargo fmt --version

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Pinned to the current latest stable (matches rust-toolchain.toml's
      # resolved version locally). The Sprint-1 dependency bumps
      # (reqwest 0.12 with stream feature, futures-util 0.3, bytes) lifted
      # the effective MSRV above 1.85, so a 1.85 MSRV guard no longer
      # applies to this workspace.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: 1.94.1
          components: clippy

      - name: Override rust-toolchain.toml with pinned version
        run: rustup override set 1.94.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: be-cache-1.94.1

      - name: versions
        run: |
          rustc --version
          cargo clippy --version

      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Smoke-test only — clippy already validates compilation and lints.
  # A release-profile rebuild was pushing the job past its 20 min cold-cache
  # budget, for no additional signal.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: 1.94.1

      - name: Override rust-toolchain.toml with pinned version
        run: rustup override set 1.94.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: be-cache-1.94.1

      - name: cargo test
        run: cargo test --workspace --all-targets
