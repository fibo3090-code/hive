name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - 'back-end/**'
      - '.github/workflows/ci-back-end.yml'
  pull_request:
    paths:
      - 'back-end/**'
      - '.github/workflows/ci-back-end.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt-clippy:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: back-end
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin to the current latest stable so fmt + clippy output is
          # reproducible across local and CI (dtolnay/rust-toolchain's
          # `stable` resolves to whatever is current at job runtime,
          # which can drift between local and CI).
          - rust: 1.94.1
          - rust: 1.85.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Override rust-toolchain.toml with matrix version
        run: rustup override set ${{ matrix.rust }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: be-cache-${{ matrix.rust }}

      - name: rustc + cargo versions
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-build:
    name: test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy

      - name: Override rust-toolchain.toml with pinned version
        run: rustup override set 1.94.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: be-cache-1.94.1

      - name: Cache target directory
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: back-end/target
          key: be-target-${{ runner.os }}-${{ hashFiles('back-end/**/Cargo.lock') }}
          restore-keys: |
            be-target-${{ runner.os }}-

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: build (release profile, sanity)
        run: cargo build --workspace --release
