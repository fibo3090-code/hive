[package]
name = "hive-api"
version.workspace = true
edition.workspace = true

[features]
# Optional, off by default: compiles the in-process Restate workflow service so
# `HIVE_WORKFLOW_BACKEND=restate` can actually execute the spawn pipeline under
# Restate's durable runtime. Kept behind a feature so `restate-sdk` is NOT a
# mandatory dependency — a plain `cargo build` is unchanged. See docs/WORKFLOW_BACKENDS.md.
restate = ["dep:restate-sdk"]

[dependencies]
restate-sdk = { version = "0.8", optional = true }
anyhow = { workspace = true }
async-stream = { workspace = true }
async-trait = "0.1"
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dirs = "5"
dotenvy = { workspace = true }
futures-core = { workspace = true }
hive-db = { workspace = true }
hive-crypto = { workspace = true }
hive-git = { workspace = true }
hive-llm = { workspace = true }
hive-runtime = { workspace = true }
hive-sandbox = { workspace = true }
hive-search = { workspace = true }
hive-tools = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ulid = { workspace = true }
