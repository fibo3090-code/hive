# `cargo audit` configuration. CI runs `cargo audit --deny warnings`
# from this directory; advisories that we have explicitly reviewed and
# accepted (because no fix exists yet, the path is not exercised, or
# the upgrade is tracked elsewhere) go in the `[advisories.ignore]`
# list with a one-line rationale.
#
# Convention: every ignored advisory must include a comment with
#   - the advisory ID
#   - why the codebase isn't actually affected
#   - the issue/PR tracking the eventual upgrade.
#
# NOTE: CI (`.github/workflows/ci-back-end.yml`) passes the ignore set as
# explicit `--ignore` flags — that list is the source of truth for the
# gate. Keep this file in sync so a local `cargo audit` matches CI.

[advisories]
ignore = [
    # RUSTSEC-2023-0071: rsa is present only through sqlx-mysql in the lockfile;
    # the resolved workspace graph does not enable MySQL (`cargo tree --target all
    # -i sqlx-mysql` is empty). Track removal by dropping sea-orm-migration's
    # optional CLI dependency when SeaORM/SQLx exposes a fixed path.
    "RUSTSEC-2023-0071",
    # RUSTSEC-2025-0057: fxhash unmaintained (transitive; not directly pulled).
    "RUSTSEC-2025-0057",
    # RUSTSEC-2026-0173: proc-macro-error2 unmaintained (transitive).
    "RUSTSEC-2026-0173",
    # RUSTSEC-2024-0436: paste unmaintained (via restate-sdk-macros, `restate` feature).
    "RUSTSEC-2024-0436",
    # RUSTSEC-2026-0190: anyhow unsound Error::downcast_mut() (2026-06-25). The
    # workspace never calls downcast_mut (`grep -r downcast_mut back-end` is
    # empty), so the unsound path is not exercised. Drop when a patched anyhow
    # is released.
    "RUSTSEC-2026-0190",
]

[output]
deny = ["warnings", "unmaintained", "unsound"]
