[workspace]
resolver = "2"
members = [
    "crates/hive-api",
    "crates/hive-domain",
    "crates/hive-db",
    "crates/hive-db/migration",
    "crates/hive-seed",
    "crates/hive-crypto",
    "crates/hive-llm",
    "crates/hive-runtime",
    "crates/hive-sandbox",
    "crates/hive-search",
    "crates/hive-tools",
    "crates/hive-git",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7" }
async-stream = "0.3"

# Web framework
axum = { version = "0.7", features = ["macros", "multipart"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = { version = "0.4" }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database
sea-orm = { version = "1", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "1" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-core = "0.3"
futures-util = "0.3"
bytes = "1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config
dotenvy = "0.15"
toml = "0.8"

# Time
chrono = { version = "0.4", features = ["serde"] }

# ID generation
ulid = "1"

# Validation
validator = { version = "0.18", features = ["derive"] }
clap = { version = "4", features = ["derive"] }

# Internal crates
hive-domain = { path = "crates/hive-domain" }
hive-db = { path = "crates/hive-db" }
migration = { path = "crates/hive-db/migration" }
hive-crypto = { path = "crates/hive-crypto" }
hive-llm = { path = "crates/hive-llm" }
hive-runtime = { path = "crates/hive-runtime" }
hive-sandbox = { path = "crates/hive-sandbox" }
hive-search = { path = "crates/hive-search" }
hive-tools = { path = "crates/hive-tools" }
hive-git = { path = "crates/hive-git" }
